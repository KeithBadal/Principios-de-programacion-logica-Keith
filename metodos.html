<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>🐼 Métodos</title>
</head>
<body class="min-h-screen bg-gradient-to-br from-purple-900 via-gray-900 to-black flex items-center justify-center p-4 relative overflow-hidden">
    <span class="absolute text-6xl sm:text-7xl md:text-8xl opacity-30 top-5 left-5 sm:left-10 select-none">🐼</span>
    <span class="absolute text-5xl sm:text-6xl md:text-7xl opacity-25 bottom-10 right-5 sm:right-10 select-none">🐼</span>
    <span class="absolute text-4xl sm:text-5xl opacity-20 top-1/2 -translate-y-1/2 left-2 sm:left-5 select-none hidden sm:block">🐼</span>
    <span class="absolute text-4xl sm:text-5xl opacity-20 bottom-20 left-1/3 select-none hidden sm:block">🐼</span>
    <span class="absolute text-3xl sm:text-4xl opacity-20 top-20 right-10 select-none hidden sm:block">🐼</span>
    <div class="bg-gray-900/90 backdrop-blur-sm rounded-3xl shadow-2xl shadow-purple-500/20 p-8 w-full max-w-md relative z-10 border border-purple-500/30">
        <h1 class="text-3xl font-bold text-center text-purple-400 mb-2">🐼 Métodos 🐼</h1>
        <p class="text-center text-purple-300 text-sm mb-6">Descubre si un número es par/impar y primo</p>

        <div class="mb-4">
            <label for="numero" class="block text-sm font-medium text-purple-300 mb-1">🔢 Número:</label>
            <input type="number" placeholder="Escribe aquí un número" id="numero"
                class="w-full px-4 py-3 rounded-xl border-2 border-purple-700 focus:border-purple-400 focus:ring-2 focus:ring-purple-500/30 outline-none transition-all duration-300 bg-gray-800 text-white placeholder-gray-500">
        </div>

        <button type="button" id="btnresultado"
            class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-4 rounded-xl transition-all duration-300 shadow-md hover:shadow-lg active:scale-95 cursor-pointer">✨ Mostrar resultado ✨</button>

        <p id="resultado" class="text-center text-lg font-bold text-purple-300 bg-gray-800 rounded-xl p-4 min-h-[56px] mt-4 border border-purple-700/50"></p>
    </div>

    <script src="opera-metodos.js"></script>
    <script src="fun-metodos.js"></script>
</body>
</html>
